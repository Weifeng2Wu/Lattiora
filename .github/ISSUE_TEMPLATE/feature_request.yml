name: 功能建议
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题或场景
      description: 请描述你当前遇到的问题或使用场景
      placeholder: 例如：在管理大量论文时，无法快速按标签筛选未读文献
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望以什么方式解决这个问题
      placeholder: 例如：在 Library 表头增加一个未读筛选器，支持按标签+阅读状态组合筛选
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你有没有考虑过其他替代方案

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于理解该建议的信息、截图或参考链接
