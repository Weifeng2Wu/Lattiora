name: Bug 反馈
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间提交 issue！请尽量提供完整信息，方便我们快速定位问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要描述你遇到的 Bug
      placeholder: 例如：启动应用后点击 Vault 切换按钮无响应
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供能稳定复现问题的步骤
      placeholder: |
        1. 打开应用
        2. 进入 xxx 页面
        3. 执行 xxx 操作
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
      placeholder: 例如：应该正常切换 Vault 并刷新文件树

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
      placeholder: 例如：按钮点击后没有任何反应，控制台报错

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请填写操作系统、应用版本等信息
      placeholder: |
        - OS: macOS 15.5 / Windows 11 / Ubuntu 24.04
        - Agentero 版本: 0.5.2
        - 安装方式: 官网下载 / Homebrew / 自行编译
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 如有相关日志、报错信息或截图，请粘贴在这里
      render: shell
