name: Cloudflare web
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm typecheck:worker
      - run: pnpm lint
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist-web
          retention-days: 1
          compression-level: 1
  browser:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist-web
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated Worker and verify browser workflows
        env:
          BROWSER_TEST_SHARD: ${{ matrix.shard }}/4
        run: pnpm test:browser:isolated
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results/isolated
          retention-days: 7
