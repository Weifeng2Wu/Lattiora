name: Cloudflare web
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm typecheck:worker
      - run: pnpm lint
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated Worker and verify browser workflows
        run: |
          printf 'ACCESS_PASSWORD="local-development-password-32-chars"\nENCRYPTION_KEY="abababababababababababababababababababababababababababababababab"\n' > .dev.vars
          pnpm db:migrate:local
          pnpm dev:web > /tmp/worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:browser
