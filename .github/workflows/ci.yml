name: Cloudflare web
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm typecheck:worker
      - run: pnpm lint
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated Worker and verify browser workflows
        run: pnpm test:browser:isolated
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/isolated
          retention-days: 7
